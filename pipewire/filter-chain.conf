context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { rt.prio = 88 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    # === Seducing Purple EQ: intensiver Bass + klare Mitten/Höhen ===
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Bass Boost + Clarity"
            media.name       = "Bass Boost + Clarity"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = sub_bass
                        label = bq_peaking
                        control = { "Freq" = 50.0 "Q" = 0.8 "Gain" = 4.0 }
                    }
                    {
                        type  = builtin
                        name  = bass_shelf
                        label = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 7.0 }
                    }
                    {
                        type  = builtin
                        name  = mud_cut
                        label = bq_peaking
                        control = { "Freq" = 280.0 "Q" = 1.2 "Gain" = -2.5 }
                    }
                    {
                        type  = builtin
                        name  = presence
                        label = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 1.0 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = brilliance
                        label = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 2.0 }
                    }
                ]
                links = [
                    { output = "sub_bass:Out"    input = "bass_shelf:In" }
                    { output = "bass_shelf:Out"  input = "mud_cut:In" }
                    { output = "mud_cut:Out"     input = "presence:In" }
                    { output = "presence:Out"    input = "brilliance:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.bass_clarity"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.bass_clarity"
                node.passive = true
            }
        }
    }
]
