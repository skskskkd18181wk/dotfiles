general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/roman/.local/share/wallpapers/waifu-purple.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
}

label {
    monitor =
    text = $TIME
    color = rgba(efeaffff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +%A·%d.%B
    color = rgba(c9b8ffdd)
    font_size = 26
    font_family = JetBrainsMono Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = Willkommen zurück, Roman
    color = rgba(efeaffaa)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -145
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    outer_color = rgba(9a66ffff)
    inner_color = rgba(1a122bd9)
    font_color = rgba(efeaffff)
    check_color = rgba(9a66ffff)
    fail_color = rgba(ff5c5cff)
    fade_on_empty = false
    placeholder_text = <i>Passwort…</i>
    fail_text = <i>Fehler: $FAIL</i>
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}
