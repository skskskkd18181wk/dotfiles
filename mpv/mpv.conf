# Seducing Purple – mpv
hwdec=auto-safe
vo=gpu-next
profile=high-quality
dscale=ewa_lanczossharp
cscale=ewa_lanczossharp
correct-downscaling=yes
linear-downscaling=yes

keep-open=yes
save-position-on-quit=yes
volume=100
volume-max=150
audio-file-auto=fuzzy
ytdl-format=bestvideo[height<=2160]+bestaudio/best

# Purple OSD
osd-color='#efeaff'
osd-border-color='#1a122b'
osd-border-size=2
osd-font-size=44
osd-bar-h=4
osd-bar-bordered=no
osd-on-seek=msg-bar
sub-color='#c9b8ff'
sub-border-color='#1a122b'
sub-border-size=2
background-color='#1a122b'

cursor-autohide-fs-only=yes
input-doubleclick-delay=300
